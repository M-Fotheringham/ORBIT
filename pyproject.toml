[project]
name = "orbit"
version = "1.2.0"
description = "Supervised Machine-Learning Phenotyping for multiplex pathology images."
readme = "README.md"
authors = [{name = "Michael Fotheringham"}]
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "tifffile",
    "scikit-image",
    "scipy",
    "matplotlib",
    "napari",
    "ome-zarr>=0.12,<0.13",
    "qtpy",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "pyside6",
    "qptifffile",
    "cellpose>=4.2.1.1,<5",
]

[project.scripts]
orbit = "orbit.app:main"
orbit-batch = "orbit.batch:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22,<7",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true