[project]
name = "orbit"
version = "1.2.0"
description = "Supervised Machine-Learning Phenotyping for multiplex pathology images."
readme = "README.md"
authors = [{name = "Michael Fotheringham"}]
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "tifffile",
    "scikit-image",
    "matplotlib",
    "napari",
    "ome-zarr>=0.12,<0.13",
    "qtpy",
    "pyside6",
    "qptifffile",
    "cellpose>=4.2.1.1,<5",
]

[project.scripts]
orbit = "orbit.app:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
